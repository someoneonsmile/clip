name: Build

on:
  workflow_call:
    inputs:
      version_suffix:
        required: false
        type: string
        default: ''
        description: 'Appended to Cargo.toml version (e.g. "-nightly-20260813-6-gfc18cbf")'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: clip-x86_64-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: clip-x86_64-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: clip-aarch64-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: clip-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: clip-aarch64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: clip-x86_64-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (musl build)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Override version for nightly
        if: inputs.version_suffix != ''
        shell: bash
        run: |
          CURRENT=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          NEW="${CURRENT}${{ inputs.version_suffix }}"
          sed -i.bak "1,/^version = /s/^version = \".*\"/version = \"${NEW}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "Build version: ${NEW}"

      - name: Build (native)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (musl via cross)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/clip ${{ matrix.asset }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/clip.exe ${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
