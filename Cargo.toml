[package]
name = "clip"
version = "3.0.1"
edition = "2024"

[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
is-terminal = "0.4"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0"

[profile.release]
lto = true
codegen-units = 1
strip = true
